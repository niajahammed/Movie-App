<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie App</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
  <div class="flex min-h-screen">
    <aside class="w-64 bg-white p-6 shadow-lg sticky top-0 h-screen shrink-0">
      <h1 class="text-2xl font-bold text-red-500 mb-8">
        FlixNow
      </h1>

      <nav class="space-y-4">
        <a href="#" id="homeLink" onclick="trendingMovies(event)" class="block text-red-500 font-semibold">
          Home
        </a>

        
        <div class="relative group">
          <a href="#" id="trendingLink" onclick="allTrendingMovies(event)" class="flex justify-between items-center text-gray-500">
            <span>Trending</span>
            <span>-></span>
          </a>

          <div class="absolute left-[50%] top-0 ml-2 w-44 bg-white border border-gray-200 rounded-lg shadow-xl py-2 hidden group-hover:flex flex-col z-50">
            <a href="#" onclick="fetchTrendingMovies(event)" class="px-4 py-2 text-sm text-gray-600 hover:bg-red-50 hover:text-red-500 font-medium">Movies</a>
            <a href="#" onclick="fetchTrendingTV(event)" class="px-4 py-2 text-sm text-gray-600 hover:bg-red-50 hover:text-red-500 font-medium">TV Series</a>
          </div>
        </div>

        <div class="relative group">
          <a href="#" class="flex justify-between items-center text-gray-500">
            <span>Genres</span>
            <span>-></span>
          </a>

          <div class="absolute left-[50%] top-0 ml-2 w-44 bg-white border border-gray-200 rounded-lg shadow-xl py-2 hidden group-hover:flex flex-col z-50">
            <a href="#" class="block text-gray-800 px-4 py-2 hover:bg-rose-50 hover:text-rose-500">
              Movies
            </a>
            <a href="#" class="block text-gray-800 px-4 py-2 hover:bg-rose-50 hover:text-rose-500">
              TV Series
            </a>
          </div>
        </div>

        <a href="#" class="block text-gray-500">
          Favorites
        </a>
      </nav>
    </aside>

    <main class="flex-1 p-8">
      <div class="flex justify-between items-center gap-4 mb-8">
        <input type="text" placeholder="Search movie..." class="w-full px-4 py-2 rounded-lg border">
        <button class="bg-red-500 text-white px-5 py-2 rounded-lg">
          Search
        </button>
      </div>

      <!-- <div id="heroBanner" class="relative rounded-2xl overflow-hidden h-80 mb-10">
        

        
      </div> -->

      <h2 id="sectionTitle" class="text-2xl font-bold mb-6">
        Trending Movies
      </h2>

      <div id="movieContainer" class="grid grid-cols-2 my-10 md:grid-cols-4 gap-6 sm:grid-cols-2">
        <!-- display trending movies here  -->
      </div>

      <a href="#" id="seeMoreBtn" onclick="allTrendingMovies(event)">See More -></a>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
