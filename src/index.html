<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="./output.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
  <div class="flex min-h-screen">
    <aside class="w-64 bg-white p-6 shadow-lg">
      <h1 class="text-2xl font-bold text-red-500 mb-8">
        FlixNow
      </h1>

      <nav class="space-y-4">
        <a href="#" class="block text-red-500 font-semibold">
          Home
        </a>

        <a href="#" class="block text-gray-500">
          Trending
        </a>

        <a href="#" class="block text-gray-500">
          Genres
        </a>

        <a href="#" class="block text-gray-500">
          Favorites
        </a>
      </nav>
    </aside>

    <main class="flex-1 p-8">
      <div class="flex justify-between items-center gap-4 mb-8">
        <input type="text" placeholder="Search movie..." class="w-full px-4 py-2 rounded-lg border">
        <button class="bg-red-500 text-white px-5 py-2 rounded-lg">
          Search
        </button>
      </div>

      <div class="relative rounded-2xl overflow-hidden h-80 mb-10">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSBB4LQTn0vRq4ydPLp-uTj_lEUHOHYWUU18JlCq5KuMw&s=10" class="w-full h-full object-cover" alt="">

        <div class="absolute inset-0 bg-black/50 flex items-end">
          <div class="p-8 text-white">
            <h2 class="text-4xl font-bold">
              Movie Title
            </h2>
            <p class="mt-2">
              Movie overview here...
            </p>
          </div>
        </div>
      </div>

      <h2 class="text-2xl font-bold mb-6">
        Trending Movies
      </h2>

      <div id="movieContainer" class="grid grid-cols-2 my-10 md:grid-cols-4 gap-6">
        <!-- display trending movies here  -->
      </div>
    </main>
  </div>




  <script src="app.js"></script>
</body>
</html>
