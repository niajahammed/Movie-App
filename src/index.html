<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie App</title>
  
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: "class",
    }
  </script>

   <script>
    if (localStorage.getItem("theme") === "dark") {
      document.documentElement.classList.add("dark");
    }
  </script>
</head>
<body class="bg-gray-100 text-gray-800 dark:bg-gray-900 dark:text-gray-200 transition-colors duration-200">
  <div>
    <div class="flex justify-between p-8 items-center bg-white dark:bg-gray-800  sticky top-0 z-50 transition-colors duration-200">
      <h1 class="text-3xl font-bold text-rose-600 cursor-pointer dark:text-rose-500" onclick="location.reload()">
        FlixNow
      </h1>

      <nav class="flex justify-center gap-6">
        <a href="#" class="text-rose-600 font-semibold dark:text-rose-500" onclick="location.reload()">
          Home
        </a>

        <div class="relative group">
          <a href="#" class="text-gray-500 dark:text-gray-200">
            Movies
          </a>

          <div class="absolute top-full left-0 hidden bg-white p-2 border border-gray-200 rounded-md shadow-lg min-w-[150px] z-50 group-hover:block flex flex-col dark:bg-gray-800 dark:border-gray-700">
            <ul>
              <a href="#" class="text-gray-600 dark:hover:bg-gray-700 dark:text-gray-200 dark:hover:rounded-md py-2 px-3 block hover:bg-rose-50 hover:rounded-md hover:text-rose-500">
                Popular
              </a>

              <a href="#" class="text-gray-600 dark:text-gray-200 dark:hover:bg-gray-700 dark:hover:rounded-md py-2 px-3 block hover:bg-rose-50 hover:rounded-md hover:text-rose-500">
                Now Playing
              </a>

              <a href="#" class="text-gray-600 dark:text-gray-200 dark:hover:bg-gray-700 dark:hover:rounded-md py-2 px-3 block hover:bg-rose-50 hover:rounded-md hover:text-rose-500">
                Top Rated
              </a>

              <a href="#" class="text-gray-600 dark:text-gray-200 dark:hover:bg-gray-700 dark:hover:rounded-md py-2 px-3 block hover:bg-rose-50 hover:rounded-md hover:text-rose-500">
                Upcoming
              </a>
            </ul>
          </div>
        </div>

        <div class="relative group">
          <a href="" class="text-gray-500 dark:text-gray-200">
            TV Series
          </a>

          <div class="absolute top-full left-0 hidden bg-white border border-gray-200 py-2 px-3 rounded-md shadow-lg min-w-[180px] z-50 group-hover:block flex flex-col dark:bg-gray-800 dark:border-gray-700">
            <a href="#" class="text-gray-600 dark:text-gray-200 dark:hover:bg-gray-700 dark:hover:rounded-md py-2 px-3 block hover:bg-rose-50 hover:rounded-md hover:text-rose-500">
              Popular Shows
            </a>

            <a href="#" class="text-gray-600 dark:text-gray-200 dark:hover:bg-gray-700 dark:hover:rounded-md py-2 px-3 block hover:bg-rose-50 hover:rounded-md hover:text-rose-500">
              Airing Today
            </a>

            <a href="#" class="text-gray-600 dark:text-gray-200 dark:hover:bg-gray-700 dark:hover:rounded-md py-2 px-3 block hover:bg-rose-50 hover:rounded-md hover:text-rose-500">
              On The Air
            </a>

            <a href="#" class="text-gray-600 dark:text-gray-200 dark:hover:bg-gray-700 dark:hover:rounded-md py-2 px-3 block hover:bg-rose-50 hover:rounded-md hover:text-rose-500">
              Top Rated Shows
            </a>
          </div>
        </div>

        <a href="#" class="text-gray-500 dark:text-gray-200">
          Genres
        </a>

        <a href="#" class="text-gray-500 dark:text-gray-200">
          Trending
        </a>
      </nav>

      <div class="flex gap-4 items-center">
        <button class="px-2 py-1 bg-gray-700 dark:bg-gray-200 text-gray-800 rounded cursor-pointer" id="themeBtn" type="button" onclick="toggleTheme()">
          🌙
        </button>

        <a href="">
          <button class="border border-gray-200 py-2 px-4 rounded-md font-semibold hover:bg-gray-200 dark:hover:bg-gray-900">
            Log In
          </button>
        </a>
        
        <a href="">
          <button class="border border-gray-200 py-2 px-4 rounded-md bg-rose-600 text-white font-semibold hover:bg-rose-700">
            Sign Up
          </button>
        </a>
      </div>
    </div>


    <div class="max-w-[1200px] mx-auto">
      <div class="flex justify-between items-center gap-6 my-10 px-8">
        <input id="searchInput" type="text" placeholder="Search Movies, TV Series..." class="w-full border border-gray-300 px-3 py-2 rounded-md dark:text-gray-800">

        <button id="searchBtn" class="text-md font-semibold bg-rose-600 text-white py-2 px-3 rounded-md cursor-pointer hover:bg-rose-700">
          SEARCH
        </button>
      </div>

      <div class="px-9">
        <h2 class="text-2xl font-semibold text-rose-600 mb-6 dark:text-rose-500">
          Movies
        </h2>

        <div id="trending-movies" class="grid grid-cols-4 gap-4 mb-10">
          <!-- display trending movies here -->
          <!-- <div class="border border-gray-300 p-2 rounded-md dark:border-gray-700">
            <img src="https://d1csarkz8obe9u.cloudfront.net/posterpreviews/movie-poster-template-design-21a1c803fe4ff4b858de24f5c91ec57f_screen.jpg?ts=1636996180" alt="" class="w-full object-cover mb-2 rounded-md">

            <h3 class="text-xl font-semibold text-gray-600 mb-2 dark:text-gray-200">
              Movie Title
            </h3>

            <p class="text-gray-500 dark:text-gray-300">
              Movie Overview
            </p>
          </div> -->
        </div>
      </div>

      <div class="px-9">
        <h2 class="text-2xl font-semibold text-rose-600 dark:text-rose-500 mb-6">
          TV
        </h2>

        <div id="trending-tv" class="grid grid-cols-4 gap-4 mb-10">
          <!-- display trending tvs here -->
          <!-- <div class="border border-gray-300 p-2 rounded-md dark:border-gray-700">
            <img src="https://d1csarkz8obe9u.cloudfront.net/posterpreviews/movie-poster-template-design-21a1c803fe4ff4b858de24f5c91ec57f_screen.jpg?ts=1636996180" alt="" class="w-full object-cover mb-2 rounded-md">

            <h3 class="text-xl font-semibold text-gray-600 mb-2 dark:text-gray-200">
              TV Title
            </h3>

            <p class="text-gray-500 dark:text-gray-400 mb-1">
              TV Overview
            </p>
          </div> -->
        </div>
      </div>
    </div>

    
  </div>

  <script src="app.js"></script>
</body>
</html>
